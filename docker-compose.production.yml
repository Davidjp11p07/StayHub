services:
  api-gateway:
    ports: !override
      - "127.0.0.1:8080:8080"
    environment:
      GATEWAY_TRUSTED_PROXY_CIDRS: ${STAYHUB_PROXY_CIDRS:?indica el CIDR del proxy de producción}
      GATEWAY_SWAGGER_SERVER_URL: ${STAYHUB_PUBLIC_API_URL:?indica la URL HTTPS pública con /api/v1}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://127.0.0.1:11434}

  accommodations-service:
    environment:
      ACCOMMODATIONS_SEARCH_PUBLIC_API_URL: ${STAYHUB_PUBLIC_API_URL:?indica la URL HTTPS pública con /api/v1}

  reports-service:
    ports: !override []

secrets:
  gateway_tls_cert:
    file: ${STAYHUB_GATEWAY_TLS_CERT:?indica el archivo de certificado interno de producción}
  gateway_tls_key:
    file: ${STAYHUB_GATEWAY_TLS_KEY:?indica el archivo de clave interna de producción}
