openapi: 3.1.0
info:
  title: StayHub Reports Service API
  version: 1.0.0
  description: API interna de lectura para RQ-12, expuesta externamente por API Gateway.
servers:
  - url: http://reports-service:3011
security:
  - delegatedJwt: []
paths:
  /reports/owner/{ownerId}:
    get:
      operationId: getOwnerReport
      summary: Resumen estadístico del propietario
      parameters:
        - $ref: '#/components/parameters/OwnerId'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Granularity'
      responses:
        '200':
          description: Reservas, cancelaciones, ingresos, ocupación y tendencias
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OwnerReport' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /reports/occupancy:
    get:
      operationId: getOccupancyReport
      summary: Ocupación del propietario por periodo
      parameters:
        - $ref: '#/components/parameters/OwnerIdQuery'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Granularity'
      responses:
        '200':
          description: Ocupación y cobertura del inventario
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OccupancyReport' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /reports/revenue:
    get:
      operationId: getRevenueReport
      summary: Ingreso neto reconocido del propietario
      parameters:
        - $ref: '#/components/parameters/OwnerIdQuery'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Granularity'
      responses:
        '200':
          description: Ingresos agrupados por moneda
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RevenueReport' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
components:
  securitySchemes:
    delegatedJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT interno de vida corta emitido por API Gateway.
  parameters:
    OwnerId:
      name: ownerId
      in: path
      required: true
      schema: { type: string, format: uuid }
    OwnerIdQuery:
      name: ownerId
      in: query
      required: true
      schema: { type: string, format: uuid }
    From:
      name: from
      in: query
      required: true
      description: Inicio inclusivo UTC.
      schema: { type: string, format: date }
    To:
      name: to
      in: query
      required: true
      description: Fin exclusivo UTC; máximo 366 días después de from.
      schema: { type: string, format: date }
    Granularity:
      name: granularity
      in: query
      required: false
      schema: { type: string, enum: [day, week, month], default: day }
  responses:
    BadRequest:
      description: Parámetros inválidos
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Token ausente o inválido
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Rol o propietario no autorizado
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Coverage:
      type: object
      required: [complete, roomInventoryAvailable]
      properties:
        complete: { type: boolean }
        roomInventoryAvailable: { type: boolean }
        reason: { type: [string, 'null'] }
    Metadata:
      type: object
      required: [ownerId, from, to, granularity, dataAsOf, coverage]
      properties:
        ownerId: { type: string, format: uuid }
        from: { type: string, format: date }
        to: { type: string, format: date }
        granularity: { type: string, enum: [day, week, month] }
        dataAsOf: { type: string, format: date-time }
        coverage: { $ref: '#/components/schemas/Coverage' }
    Money:
      type: object
      required: [currency, approvedMinor, refundedMinor, netMinor]
      properties:
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        approvedMinor: { type: integer, format: int64, minimum: 0 }
        refundedMinor: { type: integer, format: int64, minimum: 0 }
        netMinor: { type: integer, format: int64 }
    OccupancyTotals:
      type: object
      required: [occupiedNights, availableNights, occupancyRate]
      properties:
        occupiedNights: { type: integer, minimum: 0 }
        availableNights: { type: integer, minimum: 0 }
        occupancyRate: { type: [number, 'null'], minimum: 0, maximum: 100 }
    TrendPoint:
      type: object
      required: [periodStart, reservations, cancellations, revenue]
      properties:
        periodStart: { type: string, format: date }
        reservations: { type: integer, minimum: 0 }
        cancellations: { type: integer, minimum: 0 }
        occupiedNights: { type: integer, minimum: 0 }
        availableNights: { type: integer, minimum: 0 }
        occupancyRate: { type: [number, 'null'], minimum: 0, maximum: 100 }
        revenue:
          type: array
          items: { $ref: '#/components/schemas/Money' }
    OwnerReport:
      type: object
      required: [metadata, reservations, cancellations, revenue, occupancy, trends]
      properties:
        metadata: { $ref: '#/components/schemas/Metadata' }
        reservations: { type: integer, minimum: 0 }
        cancellations: { type: integer, minimum: 0 }
        cancellationRate: { type: [number, 'null'], minimum: 0, maximum: 100 }
        revenue:
          type: array
          items: { $ref: '#/components/schemas/Money' }
        occupancy: { $ref: '#/components/schemas/OccupancyTotals' }
        trends:
          type: array
          items: { $ref: '#/components/schemas/TrendPoint' }
    OccupancyReport:
      type: object
      required: [metadata, totals, series]
      properties:
        metadata: { $ref: '#/components/schemas/Metadata' }
        totals: { $ref: '#/components/schemas/OccupancyTotals' }
        series:
          type: array
          items: { $ref: '#/components/schemas/TrendPoint' }
    RevenueReport:
      type: object
      required: [metadata, totals, series]
      properties:
        metadata: { $ref: '#/components/schemas/Metadata' }
        totals:
          type: array
          items: { $ref: '#/components/schemas/Money' }
        series:
          type: array
          items: { $ref: '#/components/schemas/TrendPoint' }
    Problem:
      type: object
      required: [type, title, status, code, traceId]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        code: { type: string }
        detail: { type: string }
        traceId: { type: string }
