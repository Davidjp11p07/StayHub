openapi: 3.0.3
info:
  title: Accommodations Inventory Context Internal Contract
  version: 1.0.0
  description: Contrato mínimo provider-consumer entre Accommodations y Room Inventory.
servers:
  - url: http://accommodations-service:3003
paths:
  /internal/v1/rooms/{roomId}/inventory-context:
    get:
      operationId: getRoomInventoryContext
      summary: Obtener contexto autoritativo mínimo de una habitación
      security:
        - serviceJwt: []
      parameters:
        - name: roomId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Contexto de habitación visible para Inventory
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoomInventoryContext' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
components:
  securitySchemes:
    serviceJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT RS256 interno con scope obligatorio accommodations:inventory-context.
  schemas:
    RoomInventoryContext:
      type: object
      additionalProperties: false
      required: [roomId, propertyId, ownerId, propertyStatus, roomExists]
      properties:
        roomId: { type: string, format: uuid }
        propertyId: { type: string, format: uuid }
        ownerId: { type: string, format: uuid }
        propertyStatus: { type: string, enum: [DRAFT, PUBLISHED, UNPUBLISHED] }
        roomExists: { type: boolean, enum: [true] }
    Problem:
      type: object
      required: [type, title, status, code, traceId]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        code: { type: string }
        traceId: { type: string }
  responses:
    BadRequest:
      description: UUID inválido
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Unauthorized:
      description: Service JWT o scope inválido
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    NotFound:
      description: Habitación o propiedad inexistente/oculta; casos indistinguibles
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Unavailable:
      description: Accommodations no puede resolver el contexto
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
