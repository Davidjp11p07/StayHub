services:
  accommodations-service:
    environment:
      ACCOMMODATIONS_SEARCH_PUBLIC_API_URL: http://localhost:5173/api/v1
  api-gateway:
    ports: !override
      - "127.0.0.1:18080:8080"
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - host-access

networks:
  host-access:
    driver: bridge
