# Local clean-install acceptance environment. Use a unique Compose project.
services:
  web:
    build: {context: ., dockerfile: infra/docker/web/Dockerfile}
    networks: [host-access]
    ports: ["127.0.0.1:38443:8443"]
    secrets: [web_cert, web_key, web_gateway_ca]
    depends_on:
      api-gateway: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "-q", "-O", "/dev/null", "https://127.0.0.1:8443/login"]
      interval: 10s
      timeout: 5s
      retries: 12
  api-gateway:
    ports: !override ["127.0.0.1:38080:8080"]
  reports-service:
    ports: !override []
  accommodations-service:
    environment:
      ACCOMMODATIONS_SEARCH_PUBLIC_API_URL: https://localhost:38443/api/v1
secrets:
  web_cert: {file: .artifacts/gateway/tls_cert.pem}
  web_key: {file: .artifacts/gateway/tls_key.pem}
  web_gateway_ca: {file: .artifacts/gateway/tls_cert.pem}
